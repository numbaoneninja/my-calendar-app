<!DOCTYPE html>
<html>
<head>
    <title>Calendar Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calendar">
        <div class="calendar-header">
            <button id="prev-month">←</button>
            <h1 id="current-month"></h1>
            <button id="next-month">→</button>
        </div>
        <div class="weekdays">
            <div>Sun</div><div>Mon</div><div>Tue</div>
            <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div class="days" id="calendar-days"></div>
    </div>

    <div class="event-controls">
        <div class="add-event-group">
            <input type="date" id="event-date">
            <input type="text" id="event-text" placeholder="Event description">
            <button id="add-event">Add Event</button>
        </div>
        
        <div class="events-panel">
            <button class="toggle-panel">🔍 Show Events</button>
            <div class="panel-content">
                <input type="text" id="search-events" placeholder="Search events...">
                <div id="search-results"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <script src="script.js"></script>
</body>
</html>
